# Backup diario do banco de producao (Evolucao, Degrau 1 · backup-do-banco, 08/10).
# pg_dump (formato custom) do Postgres do Railway -> bucket R2 proprio: daily/ guarda 7, weekly/ guarda 4
# (o de domingo). DESLIGADO ate o Andre ligar a variavel BACKUP_ENABLED=true e cadastrar os segredos
# (passo a passo no vupth-docs, aba Backend). A restauracao testada e o restore-test.yml.
name: backup

on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 em Sao Paulo, fora do movimento
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}   # postgresql://usuario:senha@host:porta/banco (URL publica do Railway)
      BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.BACKUP_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # O R2 recusa o checksum que o AWS CLI novo manda por padrao (o mesmo do awssdk-com-ajuste-do-r2)
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # pg_dump 18 le servidor 18 ou anterior (o Railway esta no 18.6, 10/10); a imagem evita depender do cliente instalado no runner.
      - name: pg_dump
        run: |
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL"' > vupth.dump
          tamanho=$(stat -c %s vupth.dump)
          echo "dump: $tamanho bytes"
          [ "$tamanho" -gt 1024 ] || { echo "dump vazio ou pequeno demais"; exit 1; }
          # O arquivo tem que ser legivel pelo pg_restore, ou nao e backup.
          docker run --rm -v "$PWD":/w postgres:18 pg_restore --list /w/vupth.dump > /dev/null

      - name: Envia ao R2
        run: |
          nome="vupth-$(date -u +%Y-%m-%d).dump"
          aws s3 cp vupth.dump "s3://$BUCKET/daily/$nome" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          if [ "$(date -u +%u)" = 7 ]; then
            aws s3 cp vupth.dump "s3://$BUCKET/weekly/$nome" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi

      # exclusao-apos-restaurar (LGPD): quem apagou a conta (so o SHA-256 do id e a hora) fica fora do dump,
      # num arquivo acumulado; depois de restaurar um backup antigo, o scripts/reaplicar-exclusoes.sh le este
      # arquivo e anonimiza de novo quem apagou depois dele. Acumula com o anterior: se o proprio banco voltar
      # de um backup, as exclusoes que ele perdeu continuam aqui.
      - name: Ledger das exclusoes de conta
        run: |
          if ! docker run --rm -e DATABASE_URL postgres:18 sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "\copy (select id_hash, deleted_at from account_deletion_ledger) to stdout with (format csv)"' > atual.csv; then
            echo "::warning::sem a tabela account_deletion_ledger (antes da migration 036?) — ledger nao atualizado"
            exit 0
          fi
          aws s3 cp "s3://$BUCKET/ledger/account-deletions.csv" anterior.csv --endpoint-url "$R2_ENDPOINT" --only-show-errors || : > anterior.csv
          cat anterior.csv atual.csv | awk -F, 'NF >= 2 && !visto[$1]++' > account-deletions.csv
          echo "ledger: $(wc -l < account-deletions.csv) conta(s) apagada(s)"
          aws s3 cp account-deletions.csv "s3://$BUCKET/ledger/account-deletions.csv" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      # Retencao: os nomes levam a data, entao a ordem alfabetica e a cronologica.
      - name: Retencao (7 diarios, 4 semanais)
        run: |
          podar() {
            aws s3 ls "s3://$BUCKET/$1/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep '\.dump$' | sort | head -n -"$2" |
              while read -r velho; do
                aws s3 rm "s3://$BUCKET/$1/$velho" --endpoint-url "$R2_ENDPOINT" --only-show-errors
                echo "removido $1/$velho"
              done
          }
          podar daily 7
          podar weekly 4
