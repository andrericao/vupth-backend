name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vupth_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vupth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore JWT keys
        env:
          PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          mkdir -p src/main/resources/keys
          printf '%s' "$PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 -d > src/main/resources/keys/private.key
          printf '%s' "$PUBLIC_KEY_B64"  | tr -d '[:space:]' | base64 -d > src/main/resources/keys/public.key
          echo "Private key size: $(wc -c < src/main/resources/keys/private.key) bytes"
          echo "Public key size: $(wc -c < src/main/resources/keys/public.key) bytes"
        working-directory: vupth-backend

      - name: Run tests
        run: mvn test
        working-directory: vupth-backend

  deploy-homolog:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: npx @railway/cli@latest up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        working-directory: vupth-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
