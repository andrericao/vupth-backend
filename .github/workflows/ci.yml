name: CI/CD

on:
  push:
    branches: [ main, dev ]
    # Commits so de documentacao nao disparam build/deploy (economia de minutos).
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'

# Cancela runs superados do MESMO PR (nunca cancela push/deploy em andamento,
# pra nao interromper um deploy/rollback pela metade).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Necessario para empurrar as tags `homolog-last-good` / `prod-last-good`
# (marcam o ultimo commit que passou em cada ambiente, usados no rollback).
permissions:
  contents: write

# O alvo de cada ambiente fica AQUI, versionado, e nao em secret. Nenhuma das duas URLs
# e segredo — a de PROD ja esta commitada em postman/collection-prod.json e a de HOMOLOG
# no PRD. Em secret elas derivam sem ninguem ver (foi o que apontou o teste de PROD para
# o Render) e ainda mascaram o log justamente no passo em que se precisa ler o alvo.
env:
  HOMOLOG_URL: https://vupth-backend-ia.onrender.com
  PROD_URL: https://vupth-backend-ia-production.up.railway.app

jobs:

  # =========================
  # 🧪 TESTES LOCAIS (MAVEN)
  # =========================
  test:
    runs-on: ubuntu-latest
    # Cushion. Com reuseForks=true (cache de contexto do Spring) a suite roda em poucos
    # minutos; o teto largo protege a 1a validacao e o crescimento futuro sem mascarar hang
    # real (se algo travar de verdade, ainda falha aqui em vez de silenciosamente).
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vupth_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vupth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore JWT keys
        run: |
          mkdir -p src/main/resources/keys
          echo "${{ secrets.JWT_PRIVATE_KEY_B64 }}" | base64 -d > src/main/resources/keys/private.key
          echo "${{ secrets.JWT_PUBLIC_KEY_B64 }}"  | base64 -d > src/main/resources/keys/public.key
        working-directory: vupth-backend

      - name: Run tests
        run: mvn test
        working-directory: vupth-backend


  # =========================
  # 🚀 DEPLOY HOMOLOG (Render)
  # =========================
  deploy-homolog:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render (HOMOLOG)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}


  # =========================
  # 🧪 TESTE HOMOLOG (Newman)
  # =========================
  test-homolog:
    needs: deploy-homolog
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Confere o alvo de HOMOLOG
        run: |
          echo "Alvo de HOMOLOG: $HOMOLOG_URL"
          case "$HOMOLOG_URL" in
            https://*.onrender.com) ;;
            *) echo "::error::HOMOLOG_URL aponta para '$HOMOLOG_URL', e HOMOLOG e o Render. Testar outro host reprova por dado de outra base e dispara o rollback de um deploy que estava bom."; exit 1 ;;
          esac

      - name: Wait for Render deploy with commit verification
        run: |
          EXPECTED_COMMIT=$(git rev-parse --short HEAD)
          echo "Esperando Render deployar commit: $EXPECTED_COMMIT"

          for i in {1..60}; do
            echo "Tentativa $i/60..."

            INFO=$(curl --connect-timeout 5 --max-time 10 -s "$HOMOLOG_URL/actuator/info" || true)
            echo "Info: $INFO"

            DEPLOYED_COMMIT=$(echo "$INFO" | grep -o '"commit":{[^}]*}' | grep -o '"id":"[^"]*"' | cut -d'"' -f4 || true)

            if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Commit correto deployado! ($DEPLOYED_COMMIT)"

              HEALTH=$(curl --connect-timeout 5 --max-time 10 -s "$HOMOLOG_URL/actuator/health/readiness" || true)
              if echo "$HEALTH" | grep -q '"status":"UP"'; then
                echo "App PRONTA com commit correto!"
                exit 0
              fi
            fi

            echo "Commit deployado: '$DEPLOYED_COMMIT' | Esperado: '$EXPECTED_COMMIT'"
            sleep 15
          done

          echo "Timeout: commit $EXPECTED_COMMIT nao foi deployado em 15 min"
          exit 1

      - name: Run Postman (HOMOLOG)
        working-directory: vupth-backend
        run: |
          newman run postman/collection-homolog.json \
            --env-var "base_url=$HOMOLOG_URL" \
            --reporters cli \
            --verbose \
            --bail

      # ✅ So chega aqui se o Newman passou (--bail) → este commit e o novo "last-good" de HOMOLOG.
      - name: Marca commit como last-good (HOMOLOG)
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Marcando $SHA como homolog-last-good"
          git tag -f homolog-last-good "$SHA"
          git push -f origin homolog-last-good


  # =========================
  # ⏪ ROLLBACK HOMOLOG (Render)
  # =========================
  # Dispara SO quando o deploy saiu mas o Newman pos-deploy falhou (commit ruim em homolog).
  # Redeploya o ultimo commit que passou (tag homolog-last-good) via API do Render.
  rollback-homolog:
    needs: [deploy-homolog, test-homolog]
    if: ${{ always() && needs.deploy-homolog.result == 'success' && needs.test-homolog.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ultimo commit bom (HOMOLOG)
        id: lastgood
        run: |
          git fetch --tags --force
          if ! git rev-parse -q --verify refs/tags/homolog-last-good >/dev/null; then
            echo "::error::Deploy ruim em HOMOLOG e NAO existe homolog-last-good para reverter — app pode estar quebrada. Reverta manualmente pelo painel do Render."
            exit 1
          fi
          SHA=$(git rev-parse homolog-last-good)
          echo "Ultimo commit bom de HOMOLOG: $SHA"
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Redeploy do last-good no Render (API)
        if: steps.lastgood.outputs.have == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GOOD_SHA: ${{ steps.lastgood.outputs.sha }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY/RENDER_SERVICE_ID nao configurados — rollback automatico do Render INDISPONIVEL e o app pode estar quebrado."
            echo "::error::Adicione esses 2 secrets (commit alvo do rollback: $GOOD_SHA) ou reverta JA pelo painel do Render."
            exit 1
          fi
          echo "Redeployando commit $GOOD_SHA no Render..."
          curl --fail -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$GOOD_SHA\"}"

          echo "Aguardando HOMOLOG voltar (readiness)..."
          for i in {1..40}; do
            H=$(curl -s --connect-timeout 5 --max-time 10 "$HOMOLOG_URL/actuator/health/readiness" || true)
            if echo "$H" | grep -q '"status":"UP"'; then
              echo "HOMOLOG restaurado no last-good ($GOOD_SHA)!"
              exit 0
            fi
            echo "Tentativa $i/40 — aguardando..."
            sleep 15
          done
          echo "::error::Timeout aguardando HOMOLOG apos rollback"
          exit 1


  # =========================
  # 🚀 DEPLOY PROD (Railway)
  # =========================
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Marca o instante ANTES de disparar: e o corte que o test-prod usa para
      # separar a instancia nova da que ainda esta respondendo.
      - name: Marca o inicio do deploy
        id: deploy_start
        run: echo "at=$(date -u +%s)000" >> "$GITHUB_OUTPUT"

      - name: Deploy to Railway (PROD)
        run: |
          npm install -g @railway/cli
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    outputs:
      deploy_started_at: ${{ steps.deploy_start.outputs.at }}


  # =========================
  # 🧪 TESTE PROD (Newman)
  # =========================
  test-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    # O teto cobre a espera (15 min) + newman com folga. O `railway up --detach`
    # volta assim que o upload termina, entao a espera abaixo ainda paga o build
    # do Railway (Maven) ANTES do boot da JVM — 10 min nao davam conta, e estourar
    # aqui aciona o rollback de um deploy que estava vindo bem.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      # Health UP nao prova nada durante um rollout: a instancia ANTERIOR continua
      # respondendo UP enquanto a nova sobe, e o newman acaba testando o codigo
      # velho. Foi o que reprovou o deploy de 12/08 e disparou o rollback de um
      # deploy que estava correto.
      #
      # O corte e o startedAtEpochMs do /actuator/info: so serve a instancia que
      # subiu DEPOIS de o deploy ser disparado. Comparamos numero com numero de
      # proposito — interpretar data em shell falharia para o lado errado (o loop
      # estouraria o tempo e o rollback reverteria um deploy bom).
      #
      # Nao usamos o commit porque o railway up nao carrega contexto de git: la o
      # valor fica "unknown". No Render, onde ele existe, o test-homolog ja o usa.
      - name: Confere o alvo de PROD
        run: |
          echo "Alvo de PROD: $PROD_URL"
          case "$PROD_URL" in
            https://*.up.railway.app) ;;
            *) echo "::error::PROD_URL aponta para '$PROD_URL', e PROD e o Railway. Testar outro host reprova por dado de outra base e dispara o rollback de um deploy que estava bom."; exit 1 ;;
          esac

      - name: Wait for Railway (instancia NOVA, nao so healthy)
        run: |
          DEPLOY_AT=${{ needs.deploy-prod.outputs.deploy_started_at }}
          echo "Corte: instancias iniciadas antes de $DEPLOY_AT (epoch ms) nao servem."

          for i in $(seq 1 60); do
            INFO=$(curl --connect-timeout 5 --max-time 10 -s "$PROD_URL/actuator/info" || true)
            STARTED_MS=$(echo "$INFO" | grep -o '"startedAtEpochMs":[0-9]*' | cut -d: -f2 || true)

            if [ -z "$STARTED_MS" ]; then
              # Build anterior a este ajuste: sem o campo nao da para distinguir a
              # instancia nova da velha. Seguir esperando e melhor que testar as cegas.
              echo "Tentativa $i/60 — /actuator/info ainda sem startedAtEpochMs."
            elif [ "$STARTED_MS" -gt "$DEPLOY_AT" ]; then
              HEALTH=$(curl --connect-timeout 5 --max-time 10 -s "$PROD_URL/actuator/health" || true)
              if echo "$HEALTH" | grep -q '"status":"UP"'; then
                echo "Instancia NOVA no ar (startedAtEpochMs=$STARTED_MS) e saudavel."
                exit 0
              fi
              echo "Tentativa $i/60 — instancia nova subindo, ainda nao saudavel."
            else
              echo "Tentativa $i/60 — respondendo a instancia anterior ($STARTED_MS)."
            fi
            sleep 15
          done

          echo "::error::Timeout: nenhuma instancia iniciada apos o deploy respondeu em 15 min."
          echo "::error::Se o /actuator/info nunca trouxe startedAtEpochMs, a build no ar e anterior a este ajuste."
          exit 1

      - name: Debug API
        run: |
         curl -v "$PROD_URL/actuator/health"
         curl -v "$PROD_URL/actuator/health/readiness"

      - name: Run Postman (PROD)
        working-directory: vupth-backend
        run: |
          newman run postman/collection-prod.json \
            --env-var "base_url=$PROD_URL" \
            --reporters cli \
            --verbose \
            --bail

      # ✅ So chega aqui se o Newman passou (--bail) → este commit e o novo "last-good" de PROD.
      - name: Marca commit como last-good (PROD)
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Marcando $SHA como prod-last-good"
          git tag -f prod-last-good "$SHA"
          git push -f origin prod-last-good


  # =========================
  # ⏪ ROLLBACK PROD (Railway)
  # =========================
  # Dispara SO quando o deploy saiu mas o Newman pos-deploy falhou (commit ruim em prod).
  # Redeploya o ultimo commit que passou (tag prod-last-good) fazendo checkout + railway up.
  rollback-prod:
    needs: [deploy-prod, test-prod]
    if: ${{ always() && needs.deploy-prod.result == 'success' && needs.test-prod.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Distancia maxima que o rollback aceita percorrer para tras. Acima disso ele
    # RECUSA (ver o passo "Confere a distancia"). Um rollback existe para desfazer
    # UM deploy ruim; quando a tag esta muito atras, ela nao e mais um ponto de
    # retorno, e sim uma tag congelada — e reinstala-la joga fora trabalho que
    # nunca foi provado ruim.
    env:
      MAX_ROLLBACK_DISTANCE: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ultimo commit bom (PROD)
        id: lastgood
        run: |
          git fetch --tags --force
          if ! git rev-parse -q --verify refs/tags/prod-last-good >/dev/null; then
            echo "::error::Deploy ruim em PROD e NAO existe prod-last-good para reverter — app pode estar quebrada. Reverta manualmente (railway / painel)."
            exit 1
          fi
          SHA=$(git rev-parse prod-last-good)
          echo "Ultimo commit bom de PROD: $SHA"
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # O laco de 12/08: a tag so avanca quando o Newman passa, entao um Newman que
      # falha a congela; e cada tentativa de deploy seguinte reinstalava a build
      # congelada. Quanto mais se tentava deployar, mais firme prod ficava no
      # passado — prod-last-good parou em 29/06 enquanto main andou 90 commits.
      #
      # Um auto-rollback sem teto e um laco. Aqui ele passa a ter teto: perto,
      # reverte como sempre; longe, RECUSA e falha alto, deixando a build nova no
      # ar. Entre uma assercao de Newman falhando e 90 commits fora do ar, a
      # assercao e o problema menor — e um erro visivel no CI e melhor que uma
      # reversao silenciosa que ninguem le.
      - name: Confere a distancia antes de reverter
        if: steps.lastgood.outputs.have == 'true'
        run: |
          SHA=${{ steps.lastgood.outputs.sha }}
          DISTANCE=$(git rev-list --count "$SHA"..HEAD)
          AGE_DAYS=$(( ( $(date -u +%s) - $(git show -s --format=%ct "$SHA") ) / 86400 ))

          echo "prod-last-good: $SHA ($DISTANCE commits atras, $AGE_DAYS dias)"

          if [ "$DISTANCE" -gt "$MAX_ROLLBACK_DISTANCE" ]; then
            echo "::error::ROLLBACK RECUSADO — prod-last-good esta $DISTANCE commits atras (teto: $MAX_ROLLBACK_DISTANCE), com $AGE_DAYS dias."
            echo "::error::Reverter reinstalaria uma build de $AGE_DAYS dias atras e apagaria de producao trabalho que nunca foi provado ruim."
            echo "::error::A build recem-deployada FICA NO AR. Investigue a falha do Newman acima: o mais provavel e a tag ter congelado, nao o codigo novo estar quebrado."
            echo "::error::Se o codigo novo estiver mesmo ruim, reverta pelo painel do Railway. Se estiver bom, corrija o que reprovou e deixe a tag avancar."
            exit 1
          fi

          echo "Distancia dentro do teto — rollback autorizado."

      - name: Checkout do last-good
        if: steps.lastgood.outputs.have == 'true'
        run: git checkout ${{ steps.lastgood.outputs.sha }}

      - name: Redeploy do last-good no Railway
        if: steps.lastgood.outputs.have == 'true'
        run: |
          npm install -g @railway/cli
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Aguarda PROD voltar (readiness)
        if: steps.lastgood.outputs.have == 'true'
        run: |
          for i in {1..30}; do
            H=$(curl -s --connect-timeout 5 --max-time 10 "$PROD_URL/actuator/health" || true)
            if echo "$H" | grep -q '"status":"UP"'; then
              echo "PROD restaurado no last-good (${{ steps.lastgood.outputs.sha }})!"
              exit 0
            fi
            echo "Tentativa $i/30 — aguardando..."
            sleep 15
          done
          echo "::error::Timeout aguardando PROD apos rollback"
          exit 1
