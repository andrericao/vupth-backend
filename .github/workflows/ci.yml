name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # =========================
  # 🧪 TESTES LOCAIS (MAVEN)
  # =========================
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vupth_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vupth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore JWT keys
        run: |
          mkdir -p src/main/resources/keys
          echo "${{ secrets.JWT_PRIVATE_KEY_B64 }}" | base64 -d > src/main/resources/keys/private.key
          echo "${{ secrets.JWT_PUBLIC_KEY_B64 }}"  | base64 -d > src/main/resources/keys/public.key
        working-directory: vupth-backend

      - name: Run tests
        run: mvn test
        working-directory: vupth-backend


  # =========================
  # 🚀 DEPLOY HOMOLOG (Render)
  # =========================
  deploy-homolog:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render (HOMOLOG)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}


  # =========================
  # 🧪 TESTE HOMOLOG (Newman)
  # =========================
  test-homolog:
    needs: deploy-homolog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      # 🔥 ALTERADO: antes era sleep 15
      - name: Wait for Render (health check)
        run: |
          for i in {1..12}; do
            curl -f ${{ secrets.HOMOLOG_URL }}/actuator/health && break
            echo "Waiting for Render app..."
            sleep 5
          done

      - name: Debug files
        run: |
          pwd
          ls -R

      - name: Run Postman (HOMOLOG)
        working-directory: vupth-backend
        run: |
          newman run postman/collection.json \
            --env-var "base_url=${{ secrets.HOMOLOG_URL }}" \
            --reporters cli


  # =========================
  # 🚀 DEPLOY PROD (Railway)
  # =========================
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (PROD)
        run: npx @railway/cli@latest up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        working-directory: vupth-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


  # =========================
  # 🧪 TESTE PROD (Newman)
  # =========================
  test-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      # 🔥 ALTERADO: antes era sleep 15
      - name: Wait for Railway (health check)
        run: |
          for i in {1..6}; do
            curl -f ${{ secrets.PROD_URL }}/actuator/health && break
            echo "Waiting for Railway app..."
            sleep 5
          done

      - name: Run Postman (PROD)
        working-directory: vupth-backend
        run: |
          newman run postman/collection.json \
            --env-var "base_url=${{ secrets.PROD_URL }}" \
            --reporters cli
