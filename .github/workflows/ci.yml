name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # =========================
  # 🧪 TESTES LOCAIS (MAVEN)
  # =========================
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vupth_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vupth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore JWT keys
        run: |
          mkdir -p src/main/resources/keys
          echo "${{ secrets.JWT_PRIVATE_KEY_B64 }}" | base64 -d > src/main/resources/keys/private.key
          echo "${{ secrets.JWT_PUBLIC_KEY_B64 }}"  | base64 -d > src/main/resources/keys/public.key
        working-directory: vupth-backend

      - name: Run tests
        run: mvn test
        working-directory: vupth-backend


  # =========================
  # 🚀 DEPLOY HOMOLOG (Render)
  # =========================
  deploy-homolog:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render (HOMOLOG)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}


  # =========================
  # 🧪 TESTE HOMOLOG (Newman)
  # =========================
  test-homolog:
    needs: deploy-homolog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Wait for Render deploy with commit verification
        run: |
          EXPECTED_COMMIT=$(git rev-parse --short HEAD)
          echo "Esperando Render deployar commit: $EXPECTED_COMMIT"

          for i in {1..60}; do
            echo "Tentativa $i/60..."

            INFO=$(curl --connect-timeout 5 --max-time 10 -s ${{ secrets.HOMOLOG_URL }}/actuator/info || true)
            echo "Info: $INFO"

            DEPLOYED_COMMIT=$(echo "$INFO" | grep -o '"commit":{[^}]*}' | grep -o '"id":"[^"]*"' | cut -d'"' -f4 || true)

            if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Commit correto deployado! ($DEPLOYED_COMMIT)"

              HEALTH=$(curl --connect-timeout 5 --max-time 10 -s ${{ secrets.HOMOLOG_URL }}/actuator/health/readiness || true)
              if echo "$HEALTH" | grep -q '"status":"UP"'; then
                echo "App PRONTA com commit correto!"
                exit 0
              fi
            fi

            echo "Commit deployado: '$DEPLOYED_COMMIT' | Esperado: '$EXPECTED_COMMIT'"
            sleep 15
          done

          echo "Timeout: commit $EXPECTED_COMMIT nao foi deployado em 15 min"
          exit 1

      - name: Run Postman (HOMOLOG)
        working-directory: vupth-backend
        run: |
          newman run postman/collection-homolog.json \
            --env-var "base_url=${{ secrets.HOMOLOG_URL }}" \
            --reporters cli \
            --verbose \
            --bail


  # =========================
  # 🚀 DEPLOY PROD (Railway)
  # =========================
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (PROD)
        run: |
          npm install -g @railway/cli
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


  # =========================
  # 🧪 TESTE PROD (Newman)
  # =========================
  test-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      # 🔥 ALTERADO: antes era sleep 15
      - name: Wait for Railway (readiness check)
        run: |
          for i in {1..20}; do
            echo "Tentativa $i..."
            RESPONSE=$(curl --connect-timeout 5 --max-time 10 -s "${{ secrets.PROD_URL }}/actuator/health" || true)
            echo "Resposta: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "App PRONTA!"
              exit 0
            fi
            echo "Ainda não está pronta..."
            sleep 15
          done
          echo "Timeout aguardando app"
          exit 1

      - name: Debug API
        run: |
         curl -v ${{ secrets.PROD_URL }}/actuator/health
         curl -v ${{ secrets.PROD_URL }}/actuator/health/readiness

      - name: Run Postman (PROD)
        working-directory: vupth-backend
        run: |
          newman run postman/collection-prod.json \
            --env-var "base_url=${{ secrets.PROD_URL }}" \
            --reporters cli \
            --verbose \
            --bail
