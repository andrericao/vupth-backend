name: Keep-Alive Render

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: vars.KEEP_ALIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (staging)
        run: |
          STATUS=$(curl --connect-timeout 10 --max-time 120 -s -o /dev/null -w "%{http_code}" "${{ secrets.HOMOLOG_URL }}/actuator/health" || true)
          echo "Status: $STATUS"
