# ============================
# DATASOURCE - RAILWAY (STAGING)
# Mesmas variáveis de ambiente do prod (Railway injeta automaticamente)
# ============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ============================
# JPA - MODO OTIMIZADO
# ============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ============================
# LOGS
# ============================
logging.level.root=INFO
logging.level.com.ospaulos.vupth=INFO

# ============================
# LIQUIBASE
# Sem spring.liquibase.contexts definido → "!prod" é satisfeito → seed roda.
# Diferença do prod: prod define contexts=prod, staging não define nada.
# ============================
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# ============================
# CORS - RESTRITIVO
# ============================
# As origens autorizadas vem da env var CORS_ALLOWED_ORIGINS (ver application.properties e PRD 18e).
# ⚠️ A chave `cors.allowed-origins` que ficava aqui NAO era lida por codigo nenhum — removida em 26/08.

# ============================
# ACTUATOR - RESTRITO
# ============================
# ⚠️ `metrics` SAIU em 26/08: com o permitAll largo do actuator, /actuator/metrics era publico e sem
# token — inventario de rotas (http.server.requests), saturacao do pool (hikaricp) e JVM. Nenhum job
# do ci.yml/rollback.yml usa metrics; os dois so leem /actuator/info e /actuator/health*.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.git.enabled=false
# Readiness/liveness probes: /actuator/health/readiness so fica UP quando o banco
# responde E as migrations rodaram = sinal "pode receber cadastro agora".
# O app (Expo) usa isso como portao de boot e para acordar o Render (cold start).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ============================
# PORTA HTTP
# ============================
# Render/Railway injetam a porta esperada em $PORT; escuta nela quando existir,
# senao cai pra 8080 (local/docker). Garante que o health check do PaaS bate na
# porta certa (evita deploy "Timed Out" / "Detected service running on port 8080").
server.port=${PORT:8080}

# ============================
# SHUTDOWN GRACIOSO
# ============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ============================
# SEGURANCA
# ============================
server.error.include-message=never
server.error.include-stacktrace=never

# ============================
# PERFORMANCE
# ============================
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================
# CONNECTION POOL
# ============================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
