# ============================
# DATASOURCE - RAILWAY (STAGING)
# Mesmas variáveis de ambiente do prod (Railway injeta automaticamente)
# ============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ============================
# JPA - MODO OTIMIZADO
# ============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ============================
# LOGS
# ============================
logging.level.root=INFO
logging.level.com.ospaulos.vupth=INFO

# ============================
# LIQUIBASE
# Sem spring.liquibase.contexts definido → "!prod" é satisfeito → seed roda.
# Diferença do prod: prod define contexts=prod, staging não define nada.
# ============================
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# ============================
# CORS - RESTRITIVO
# ============================
# As origens autorizadas vem da env var CORS_ALLOWED_ORIGINS (ver application.properties e PRD 18e).
# ⚠️ A chave `cors.allowed-origins` que ficava aqui NAO era lida por codigo nenhum — removida em 26/08.

# ============================
# ACTUATOR - RESTRITO
# ============================
# ⚠️ `metrics` SAIU em 26/08: com o permitAll largo do actuator, /actuator/metrics era publico e sem
# token — inventario de rotas (http.server.requests), saturacao do pool (hikaricp) e JVM. Nenhum job
# do ci.yml/rollback.yml usa metrics; os dois so leem /actuator/info e /actuator/health*.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.git.enabled=false
# Readiness/liveness probes: /actuator/health/readiness so fica UP quando o banco
# responde E as migrations rodaram = sinal "pode receber cadastro agora".
# O app (Expo) usa isso como portao de boot e para acordar o Render (cold start).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ============================
# PORTA HTTP
# ============================
# Render/Railway injetam a porta esperada em $PORT; escuta nela quando existir,
# senao cai pra 8080 (local/docker). Garante que o health check do PaaS bate na
# porta certa (evita deploy "Timed Out" / "Detected service running on port 8080").
server.port=${PORT:8080}

# Sem server.tomcat.threads.*: com spring.threads.virtual.enabled=true (application.properties) o Tomcat
# atende em threads virtuais e ignora o pool — o limite de 40 do 84e9c4f nao tinha efeito (05/10).

# ============================
# SHUTDOWN GRACIOSO
# ============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ============================
# SEGURANCA
# ============================
server.error.include-message=never
server.error.include-stacktrace=never

# ============================
# PERFORMANCE
# ============================
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================
# CONNECTION POOL
# ============================
spring.datasource.hikari.initialization-fail-timeout=0
# Render Free (512 MiB): cada conexao guarda buffers e cache de statements; 10 (ok do Andre, 17/10, requisicoes-lentas)
# com 5 paradas. A producao nao muda.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Mantem viva a conexao ociosa: sem isto o provedor do Postgres a derruba calado e o proximo request
# paga uma reconexao TLS inteira (o "perfil demorou a chegar" de 02/10).
spring.datasource.hikari.keepalive-time=240000

# ============================
# WEBSOCKET - RECUSA O CONNECT COM TOKEN INVALIDO
# ============================
# Ligado no staging em 04/10: o Client (renovar-token-no-ws, OTA) e o Partner (3949fa1) ja renovam o
# token antes do CONNECT e tratam o INVALID_TOKEN. O prod liga com WS_REJECT_INVALID_TOKEN=true.
vupth.ws.reject-invalid-token=${WS_REJECT_INVALID_TOKEN:true}

# ============================
# RATE LIMIT DE AUTH — o Newman do CI passa por fora com o header X-Vupth-CI (decisao de 05/10)
# ============================
# Mesmo valor do secret VUPTH_CI_SECRET do GitHub. Vazio = ninguem passa por fora do limite.
vupth.auth.rate-limit.ci-secret=${RATE_LIMIT_CI_SECRET:}
# De onde vem o IP do limite (ip-forjado-no-limite, 05/10): o Cloudflare na frente do Render escreve o
# CF-Connecting-IP e recusa o forjado; o X-Forwarded-For aqui comeca pelo que o cliente mandar.
vupth.auth.rate-limit.ip-header=${RATE_LIMIT_IP_HEADER:CF-Connecting-IP}

# Exclusao pela web: no staging o link abre o site de teste do Client (dev.vupth.pages.dev).
vupth.account-deletion.link-base-url=${ACCOUNT_DELETION_LINK_BASE_URL:https://dev.vupth.pages.dev/excluir-conta}

# API DOCS (springdoc) — BAK-2: /v3/api-docs e /swagger-ui abertos neste ambiente (fora da producao)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
vupth.api-docs.public=true

# Link de indicacao no staging aponta para o Client de dev (DEC-60; pedido do Client, entrada-por-link)
vupth.referral.link-base=${REFERRAL_LINK_BASE_URL:https://dev.vupth.pages.dev/i/}

# S4 (DEC-81): os dados pessoais cifrados no banco. A chave (32 bytes em base64) vem so do ambiente; sem ela o boot falha.
vupth.security.data-encryption.key=${DATA_ENCRYPTION_KEY:}
vupth.security.data-encryption.required=true
