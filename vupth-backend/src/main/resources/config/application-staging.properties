# ============================
# DATASOURCE - RAILWAY (STAGING)
# Mesmas variáveis de ambiente do prod (Railway injeta automaticamente)
# ============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ============================
# JPA - MODO OTIMIZADO
# ============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ============================
# LOGS
# ============================
logging.level.root=INFO
logging.level.com.ospaulos.vupth=INFO

# ============================
# LIQUIBASE
# Sem spring.liquibase.contexts definido → "!prod" é satisfeito → seed roda.
# Diferença do prod: prod define contexts=prod, staging não define nada.
# ============================
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# ============================
# CORS - RESTRITIVO
# ============================
# cors.allowed-origins=https://staging.meuapp.com.br

# ============================
# ACTUATOR - RESTRITO
# ============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.git.enabled=false
# Readiness/liveness probes: /actuator/health/readiness so fica UP quando o banco
# responde E as migrations rodaram = sinal "pode receber cadastro agora".
# O app (Expo) usa isso como portao de boot e para acordar o Render (cold start).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ============================
# SHUTDOWN GRACIOSO
# ============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ============================
# SEGURANCA
# ============================
server.error.include-message=never
server.error.include-stacktrace=never

# ============================
# PERFORMANCE
# ============================
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================
# CONNECTION POOL
# ============================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
