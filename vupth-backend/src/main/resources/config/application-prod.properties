# ============================
# DATASOURCE - VARIAVEIS DE AMBIENTE
# ============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ============================
# JPA - MODO OTIMIZADO
# ============================
# Nao mostra SQL (performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# NUNCA alterar schema automaticamente
spring.jpa.hibernate.ddl-auto=none

# ============================
# LOGS - APENAS IMPORTANTES
# ============================
# Menos logs
logging.level.root=INFO
logging.level.com.seu.pacote=INFO
# Arquivo de log
#logging.file.name=/var/log/app/application.log

# ============================
# LIQUIBASE - CONTROLADO
# ============================
spring.liquibase.enabled=true
spring.liquibase.contexts=prod
# NUNCA dropar em prod!
spring.liquibase.drop-first=false

# ============================
# CACHE - HABILITADO
# ============================
# Cache para performance
#spring.cache.type=redis
#spring.redis.host=${REDIS_HOST}
#spring.redis.port=${REDIS_PORT}

# ============================
# CORS - RESTRITIVO
# ============================
# Apenas dominio oficial
#cors.allowed-origins=https://meuapp.com.br

# ============================
# ACTUATOR - RESTRITO
# ============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# Porta separada (seguranca)
#management.server.port=8081

# ============================
# SEGURANCA
# ============================
# Nao expor mensagens de erro
server.error.include-message=never
# Nao expor stacktrace
server.error.include-stacktrace=never
# Forcar HTTPS
#spring.security.require-ssl=true

# ============================
# PERFORMANCE
# ============================
# Compressao GZIP
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================
# CONNECTION POOL
# ============================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000