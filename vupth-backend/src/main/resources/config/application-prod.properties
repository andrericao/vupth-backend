# ============================
# DATASOURCE - VARIAVEIS DE AMBIENTE
# ============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ============================
# JPA - MODO OTIMIZADO
# ============================
# Nao mostra SQL (performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# NUNCA alterar schema automaticamente
spring.jpa.hibernate.ddl-auto=none

# ============================
# LOGS - APENAS IMPORTANTES
# ============================
# Menos logs
logging.level.root=INFO
logging.level.com.ospaulos.vupth=INFO
# Arquivo de log
#logging.file.name=/var/log/app/application.log

# ============================
# LIQUIBASE - CONTROLADO
# ============================
spring.liquibase.enabled=true
spring.liquibase.contexts=prod
# NUNCA dropar em prod!
spring.liquibase.drop-first=false

# ============================
# CACHE - HABILITADO
# ============================
# Cache para performance
#spring.cache.type=redis
#spring.redis.host=${REDIS_HOST}
#spring.redis.port=${REDIS_PORT}

# ============================
# CORS - RESTRITIVO
# ============================
# As origens autorizadas vem da env var CORS_ALLOWED_ORIGINS (ver application.properties e PRD 18e).
# ⚠️ A chave `cors.allowed-origins` que ficava aqui NAO era lida por codigo nenhum — removida em 26/08.

# ============================
# ACTUATOR - RESTRITO
# ============================
# ⚠️ `metrics` SAIU em 26/08: com o permitAll largo do actuator, /actuator/metrics era publico e sem
# token — inventario de rotas (http.server.requests), saturacao do pool (hikaricp) e JVM. Nenhum job
# do ci.yml/rollback.yml usa metrics; os dois so leem /actuator/info e /actuator/health*.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Readiness/liveness probes: /actuator/health/readiness so fica UP quando o banco
# responde E as migrations rodaram = sinal "pode receber cadastro agora".
# O app (Expo) usa isso como portao de boot e para acordar o Render (cold start).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Porta separada (seguranca)
#management.server.port=8081

# ============================
# PORTA HTTP
# ============================
# Render/Railway injetam a porta esperada em $PORT; escuta nela quando existir,
# senao cai pra 8080 (local/docker). Garante que o health check do PaaS bate na
# porta certa (evita deploy "Timed Out" / "Detected service running on port 8080").
server.port=${PORT:8080}

# ============================
# SHUTDOWN GRACIOSO
# ============================
# Redeploy nao derruba request em andamento (drena ate 20s antes de encerrar)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ============================
# SEGURANCA
# ============================
# Nao expor mensagens de erro
server.error.include-message=never
# Nao expor stacktrace
server.error.include-stacktrace=never
# Forcar HTTPS
#spring.security.require-ssl=true

# ============================
# PERFORMANCE
# ============================
# Compressao GZIP
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================
# CONNECTION POOL
# ============================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Mantem viva a conexao ociosa: sem isto o provedor do Postgres a derruba calado e o proximo request
# paga uma reconexao TLS inteira (o "perfil demorou a chegar" de 02/10).
spring.datasource.hikari.keepalive-time=240000

# ============================
# RATE LIMIT DE AUTH — o Newman do CI passa por fora com o header X-Vupth-CI (decisao de 05/10)
# ============================
# Mesmo valor do secret VUPTH_CI_SECRET do GitHub. Vazio = ninguem passa por fora do limite.
vupth.auth.rate-limit.ci-secret=${RATE_LIMIT_CI_SECRET:}
# De onde vem o IP do limite (ip-forjado-no-limite, 05/10): a borda do Railway acrescenta o IP real no
# FIM do X-Forwarded-For (o filtro le o ultimo valor); o primeiro e o que o cliente mandar.
vupth.auth.rate-limit.ip-header=${RATE_LIMIT_IP_HEADER:X-Forwarded-For}
