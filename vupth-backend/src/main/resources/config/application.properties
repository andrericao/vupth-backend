# ============================
# JWT CONFIG
# ============================
jwt.public.key=classpath:keys/public.key
jwt.private.key=classpath:keys/private.key
#api.security.token.secret=${JWT_SECRET:my-secret-key}
jwt.access-token-expiration=PT1H
jwt.refresh-token.expiration=P7D

jwt.issuer=vupth-backend

# ============================
# THREADS VIRTUAIS (Java 21) — mais requisicoes simultaneas com a mesma memoria
# ============================
spring.threads.virtual.enabled=true

# ============================
# JPA / HIBERNATE CONFIG
# ============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# LIQUIBASE
# ============================
spring.liquibase.change-log=classpath:liquibase/changelog/changelog-master.yaml
#spring.liquibase.drop-first=false
#spring.liquibase.enabled=true

# ============================
# PROFILES SELECTION
# ============================
# spring.profiles.is_active=dev
# spring.profiles.is_active=prod
# --> Prefira definir o profile via terminal mvn spring-boot:run --> -Dspring.profiles.is_active=dev <--

# ============================
# FUSO DE NEGOCIO (BUG2b)
# ============================
# O fuso em que a loja "pensa": e contra ele que o backend compara "agora" com
# opening_time/closing_time (relogio de PAREDE, sem offset) e projeta a refeicao do dia.
# Produto single-timezone; se um dia houver loja em outro fuso, isto vira coluna do estabelecimento.
vupth.timezone=${BUSINESS_TIMEZONE:America/Sao_Paulo}

# ============================
# SENTRY - RELATORIO DE ERROS (BAK-2)
# ============================
# Sem SENTRY_DSN o SDK fica inerte. O DSN vive so nas variaveis do Render/Railway, nunca aqui.
# SENTRY_ENVIRONMENT separa staging de production no painel. Sem dados pessoais e sem tracing (cota gratis).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.send-default-pii=false

# ============================
# WEBSOCKET - CONNECT COM TOKEN INVALIDO (BAK-5 · S14/B8)
# ============================
# false = o CONNECT com token vencido/invalido segue anonimo (compatibilidade com app antigo);
# true = recusa com INVALID_TOKEN. Liga por variavel, sem deploy: o staging ja liga no profile.
vupth.ws.reject-invalid-token=${WS_REJECT_INVALID_TOKEN:false}

# ============================
# PUSH NOTIFICATIONS (backlog #1)
# ============================
# provider: expo (padrao) envia via Expo Push API; none = no-op (nao chama rede).
vupth.push.provider=${PUSH_PROVIDER:expo}
vupth.push.expo.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
# Opcional: access token do Expo (deixe vazio se o projeto nao exigir).
vupth.push.expo.access-token=${EXPO_ACCESS_TOKEN:}

# ============================
# GEOCODING / BUSCA POR PROXIMIDADE (backlog #2)
# ============================
# provider: http (padrao) = BrasilAPI CEP v2 + fallback Nominatim/OSM; none = no-op (nao chama rede).
# Ambos os servicos sao GRATUITOS e SEM CHAVE — restricao de custo zero (Andre 2026-07-27).
vupth.geocoding.provider=${GEOCODING_PROVIDER:http}
vupth.geocoding.brasilapi.url=${GEOCODING_BRASILAPI_URL:https://brasilapi.com.br/api/cep/v2}
vupth.geocoding.nominatim.url=${GEOCODING_NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
# Reverso (fatia A2): coordenada do aparelho do dono -> endereco por extenso para ele conferir.
# Mesma cota de 1 req/s da busca — nao ha equivalente na BrasilAPI, entao aqui o Nominatim e via unica.
vupth.geocoding.nominatim.reverse-url=${GEOCODING_NOMINATIM_REVERSE_URL:https://nominatim.openstreetmap.org/reverse}
# EXIGIDO pela policy do Nominatim: identifique a aplicacao e um contato real.
vupth.geocoding.user-agent=${GEOCODING_USER_AGENT:vupth-backend/1.0 (contato: no-reply@vupth.app)}
vupth.geocoding.timeout-seconds=${GEOCODING_TIMEOUT_SECONDS:5}
# geocoder-429: o Nominatim conta por IP, e o IP de saida do Render/Railway e dividido. Um 429/403 abre
# uma pausa (o Retry-After dele, ou estes segundos) sem pedido nenhum; o cadastro em fundo tenta 1x depois.
vupth.geocoding.nominatim.cooldown-seconds=${GEOCODING_NOMINATIM_COOLDOWN_SECONDS:120}
# Geocodifica no boot os enderecos sem coordenada (dado legado). Ligar so quando precisar e desligar
# depois — o backfill respeita 1 req/s, entao base grande leva minutos.
vupth.geocoding.backfill-on-boot=${GEOCODING_BACKFILL_ON_BOOT:false}

# ============================
# E-MAIL / RESET DE SENHA (backlog #1)
# ============================
# CORS — origens de NAVEGADOR autorizadas (acesso por link / build web; ver PRD secao 18e)
# ============================
# Lista separada por virgula, em formato de PADRAO (allowedOriginPatterns), nao de origem exata:
#   CORS_ALLOWED_ORIGINS=https://vupth-partner.pages.dev,https://*.vupth-partner.pages.dev
# ⚠️ O curinga cobre so o subdominio — ele NAO casa o apex. Autorizar os previews do Cloudflare
# Pages E o dominio principal sao DUAS entradas.
# Vazio (default) = nenhuma origem de navegador. Os apps NATIVOS nao sao afetados: cliente nativo
# nao manda `Origin`, entao a requisicao nem e CORS.
vupth.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

# ============================
# ACTUATOR — superficie publica
# ============================
# false = so /actuator/health/** e /actuator/info respondem; o resto e negado na cadeia de
# seguranca (ver SecurityConfig). true SO no perfil dev, onde a exposicao e `*` de proposito.
vupth.actuator.expose-all=${ACTUATOR_EXPOSE_ALL:false}

# ============================
# API DOCS (springdoc) — BAK-2
# ============================
# /v3/api-docs e /swagger-ui. false (padrao, producao) = nao existem E a cadeia nega; dev e staging
# ligam no perfil. O vupth.api-docs.public e o portao da seguranca (ver SecurityConfig).
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
vupth.api-docs.public=${API_DOCS_ENABLED:false}

# ============================
# provider: none (padrao) = no-op (so loga o codigo, nao envia).
#           smtp = JavaMailSender pela 587.  brevo = API HTTP do Brevo pela 443.
# ⚠️ NO RENDER USE brevo, NAO smtp. Medido em 17/08: a conexao TCP com smtp-relay.brevo.com:587 NAO
# COMPLETA de la (o health de mail dava 503 em 10,7s = o connectiontimeout de 10s estourando, 3x).
# Mesma conta e mesma caixa de entrada — o que muda e o transporte, e a 443 sai. O smtp continua
# aqui porque em host sem bloqueio de saida ele funciona e nao exige chave de API.
vupth.mail.provider=${MAIL_PROVIDER:none}
vupth.mail.from=${MAIL_FROM:no-reply@vupth.app}
# Validade do codigo de reset (minutos).
vupth.mail.reset-code.ttl-minutes=${RESET_CODE_TTL_MINUTES:15}
# Exclusao pela web (exclusao-por-link): o link do e-mail abre a pagina /excluir-conta do Client.
vupth.account-deletion.link-base-url=${ACCOUNT_DELETION_LINK_BASE_URL:https://vupth.pages.dev/excluir-conta}
vupth.account-deletion.ttl-minutes=${ACCOUNT_DELETION_TTL_MINUTES:30}
# BREVO API HTTP (so usados quando MAIL_PROVIDER=brevo):
# ⚠️ BREVO_API_KEY e a API KEY v3 (painel: SMTP & API > API keys) — NAO e a SMTP key do MAIL_PASS.
# Trocar uma pela outra devolve 401 "Key not found", visivel so no log [MAIL:brevo].
# O remetente (MAIL_FROM) precisa estar VERIFICADO no Brevo, senao o envio e recusado.
vupth.mail.brevo.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
vupth.mail.brevo.api-key=${BREVO_API_KEY:}
vupth.mail.brevo.from-name=${BREVO_FROM_NAME:VUPTH}
# Mesmo teto dos timeouts de SMTP abaixo, e pelo mesmo motivo: o envio roda dentro do @Transactional.
vupth.mail.brevo.timeout-ms=${BREVO_TIMEOUT_MS:10000}
# SMTP (so usados quando MAIL_PROVIDER=smtp; deixe vazios ate a fatia 2):
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# TIMEOUTS: sem eles o JavaMail espera INDEFINIDAMENTE. O envio roda dentro do @Transactional do
# ForgotPasswordUseCase, entao um SMTP que nao responde segura a transacao e a conexao do pool ate
# o socket cair sozinho — no Render free, com pool pequeno, poucas dessas derrubam o app inteiro.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
# ⚠️ HEALTH CHECK DE MAIL DESLIGADO — nao e cosmetico, e o que trava o deploy de PROD.
# O Actuator liga um MailHealthIndicator sozinho sempre que existe um JavaMailSender, e ele ABRE
# CONEXAO SMTP a cada checagem. Atencao: a linha spring.mail.host acima cria o JavaMailSender
# MESMO COM O HOST VAZIO, entao o indicador sobe em TODO ambiente, nao so onde o SMTP esta ligado.
# MEDIDO EM 17/08: /actuator/health de homolog = 503 DOWN em 10,7s (3x, assinatura do
# connectiontimeout de 10s estourando na 587); /actuator/health/readiness = UP em 0,54s.
# O job deploy-prod do ci.yml espera justamente /actuator/health com --max-time 10 — o curl estoura,
# a espera nunca se satisfaz, o test-prod nao roda e o pipeline fecha vermelho sobre um deploy que
# estava correto. Homolog escapou por esperar readiness, grupo que so tem readinessState + db.
# A razao de fundo: e-mail e BEST-EFFORT aqui (o ForgotPasswordUseCase engole a falha de proposito).
# Uma instancia que serve toda a API nao esta "doente" porque um terceiro esta fora do ar — amarrar
# a saude do processo a um provedor externo transforma indisponibilidade dele em rollback nosso.
# Historia completa: PRD_BACKEND secao 18d, "17/08". Guard: MailHealthIndicatorDisabledTest.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ============================
# SL4J / LEVELS
# ============================
#logging.level.root=INFO
# 1 - TRACE
# 2 - DEBUG
# 3 - INFO
# 4 - WARN
# 5 - ERROR
# 6 - OFF
# ============================
# FOTO DE PERFIL — Cloudflare R2 (Andre, 25/09; passo a passo no vupth-docs, pagina Backend)
# ============================
# Sem R2_ENABLED=true o upload responde 503 STORAGE_NOT_CONFIGURED.
vupth.storage.r2.enabled=${R2_ENABLED:false}
vupth.storage.r2.account-id=${R2_ACCOUNT_ID:}
vupth.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
vupth.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
vupth.storage.r2.bucket=${R2_BUCKET:vupth-profile-photos}
vupth.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
# 2 MB e a regra (ProfilePhotoService); o limite do multipart da uma folga para o envelope do form.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
