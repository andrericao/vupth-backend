# ============================
# DATASOURCE - LOCAL
# ============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ============================
# MODO DEBUG
# ============================
# Mostra SQL no console
spring.jpa.show-sql=true
# SQL formatado
spring.jpa.properties.hibernate.format_sql=true
# Valida schema
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.hibernate.ddl-auto=validate

# ============================
# LOGS - DETALHADOS
# ============================
logging.level.root=INFO
# Logs detalhados
logging.level.com.ospaulos.vupth=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================
# LIQUIBASE - PODE RODAR
# ============================
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# ============================
# SPRING DEV TOOLS
# ============================
# Reinicializacao automatica
spring.devtools.restart.enabled=true
# Live reload
spring.devtools.livereload.enabled=true

# ============================
# CACHE - DESABILITADO
# ============================
# Sem cache (ver mudancas)
spring.cache.type=none

# ============================
# CORS - PERMISSIVO
# ============================
# ⚠️ Ate 26/08 havia aqui um `cors.allowed-origins` que NENHUM codigo lia — dava a impressao de que
# autorizar uma origem era editar este arquivo. A chave de verdade e `vupth.cors.allowed-origin-patterns`
# (application.properties), lida pelo SecurityConfig.
vupth.cors.allowed-origin-patterns=http://localhost:3000,http://localhost:4200,http://localhost:8081

# ============================
# ATUATOR - TUDO EXPOSTO
# ============================
# Todos endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Local: a exposicao `*` acima so significa alguma coisa se a cadeia de seguranca deixar passar.
vupth.actuator.expose-all=true