databaseChangeLog:

  # Foundation + Auth + Address
  - include:
      file: steps/step-001-user-auth.yaml
      relativeToChangeLogFile: true

  - include:
      file: steps/step-003-user-fill-address.yaml
      relativeToChangeLogFile: true

  # Core domain tables (attendance, service_item, professional_intervals)
  - include:
      file: changesets/10-stubs/009-create-stub-attendance.yaml
      relativeToChangeLogFile: true

  # MVP foreign keys (professional, establishment, client, owner, user_roles FKs)
  - include:
      file: changesets/10-stubs/011-add-fks-mvp.yaml
      relativeToChangeLogFile: true

  # Seed data — dev / test / staging only (context: "!prod")
  - include:
      file: changesets/10-stubs/012-seed-data.yaml
      relativeToChangeLogFile: true

  # Conserta o hash da senha das contas @seed.dev em banco que já rodou o 012 com o hash errado
  - include:
      file: changesets/10-stubs/013-fix-seed-password-hash.yaml
      relativeToChangeLogFile: true

  # Attendance FKs
  - changeSet:
      id: master-fk-attendance-client
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: client_id
            constraintName: fk_attendance_client
            referencedTableName: client
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: master-fk-attendance-establishment
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: establishment_id
            constraintName: fk_attendance_establishment
            referencedTableName: establishment
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: master-fk-attendance-professional
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: professional_id
            constraintName: fk_attendance_professional
            referencedTableName: professional
            referencedColumnNames: id
            onDelete: CASCADE

  # service_item FKs
  - changeSet:
      id: master-fk-service-item-professional
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: service_item
            baseColumnNames: professional_id
            constraintName: fk_service_item_professional
            referencedTableName: professional
            referencedColumnNames: id
            onDelete: CASCADE

  # attendance_service_item FKs
  - changeSet:
      id: master-fk-attendance-service-item-attendance
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendance_service_item
            baseColumnNames: attendance_id
            constraintName: fk_asi_attendance
            referencedTableName: attendance
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: master-fk-attendance-service-item-service
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendance_service_item
            baseColumnNames: service_item_id
            constraintName: fk_asi_service_item
            referencedTableName: service_item
            referencedColumnNames: id
            onDelete: CASCADE

  # establishment_addresses FKs
  - changeSet:
      id: master-fk-establishment-addresses-establishment
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: establishment_addresses
            baseColumnNames: establishment_id
            constraintName: fk_estab_addresses_establishment
            referencedTableName: establishment
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: master-fk-establishment-addresses-address
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: establishment_addresses
            baseColumnNames: address_id
            constraintName: fk_estab_addresses_address
            referencedTableName: addresses
            referencedColumnNames: id
            onDelete: CASCADE

  # Add service_type column to establishment
  - include:
      file: changesets/50-establishment/017-add-service-type-column.yaml
      relativeToChangeLogFile: true

  # Backfill service_type for existing establishments
  - include:
      file: changesets/50-establishment/018-backfill-service-type.yaml
      relativeToChangeLogFile: true

  # Add phone + instagram columns to establishment
  - include:
      file: changesets/50-establishment/019-add-phone-instagram-columns.yaml
      relativeToChangeLogFile: true

  # Add client_price + uses_platform_pricing columns to service_item
  - include:
      file: changesets/50-establishment/020-add-serviceitem-pricing-columns.yaml
      relativeToChangeLogFile: true

  # Add opening_time + closing_time (horario de funcionamento) to establishment
  - include:
      file: changesets/50-establishment/021-add-establishment-hours.yaml
      relativeToChangeLogFile: true

  # Add nickname (apelido) column to base_user
  - include:
      file: changesets/20-auth/021-add-nickname-to-base_user.yaml
      relativeToChangeLogFile: true

  # Affiliation request table
  - include:
      file: changesets/90-affiliation/001-create-affiliation-request.yaml
      relativeToChangeLogFile: true

  # Fix: add missing DEFAULT on base_user.updated_at
  - include:
      file: changesets/00-foundation/003-fix-default-updated_at-base_user.yaml
      relativeToChangeLogFile: true

  # Remap legacy service_item_type values (NAVALHA/PROCEDIMENTO) absent from enum
  - include:
      file: changesets/50-establishment/022-remap-legacy-serviceitem-types.yaml
      relativeToChangeLogFile: true

  # professional_intervals FK
  - changeSet:
      id: master-fk-professional-intervals
      author: vupth-mvp
      changes:
        - addForeignKeyConstraint:
            baseTableName: professional_intervals
            baseColumnNames: professional_id
            constraintName: fk_professional_intervals_professional
            referencedTableName: professional
            referencedColumnNames: id
            onDelete: CASCADE

  # Service type keywords (sinonimos por tipo de servico, adicionados pelos profissionais)
  - include:
      file: changesets/50-establishment/023-create-service_type_keyword.yaml
      relativeToChangeLogFile: true

  # Skip de refeicao por dia ("Nao almocar" — item #41)
  - include:
      file: changesets/50-establishment/024-create-professional_interval_skips.yaml
      relativeToChangeLogFile: true

  # Lock da refeicao no ingresso (estabilizacao do ETA — item #37)
  - include:
      file: changesets/50-establishment/025-create-attendance_locked_intervals.yaml
      relativeToChangeLogFile: true

  # Encaixe com equalizacao de tempo (item #38): colunas is_fit + fit_ahead_length
  - include:
      file: changesets/80-attendance/004-add-attendance-fit-columns.yaml
      relativeToChangeLogFile: true

  # Intencao de fila com horario-alvo (item #40, Opcao B): colunas is_intent + target_time
  - include:
      file: changesets/80-attendance/005-add-attendance-intent-columns.yaml
      relativeToChangeLogFile: true

  # Troca de posicao na fila por consentimento mutuo (item #42): tabela queue_swap_request
  - include:
      file: changesets/80-attendance/006-create-queue-swap-request.yaml
      relativeToChangeLogFile: true

  # Multa / cancelamento tardio + strikes (item #39, Fase 1): strike_count no client + client_penalty_event
  - include:
      file: changesets/70-client/005-create-client_penalty_event.yaml
      relativeToChangeLogFile: true

  # Rating / avaliacao de atendimentos (item #6): tabela attendance_rating + agregados
  # denormalizados (rating_sum + rating_count) em professional e service_item
  - include:
      file: changesets/80-attendance/007-create-attendance_rating.yaml
      relativeToChangeLogFile: true

  # Notificacoes push (backlog #1): registro de device tokens (Expo Push Token)
  - include:
      file: changesets/95-notification/001-create-device_token.yaml
      relativeToChangeLogFile: true

  # Notificacoes push (backlog #1): flag next_notified no attendance (dedupe do "voce e o proximo")
  - include:
      file: changesets/80-attendance/008-add-next_notified.yaml
      relativeToChangeLogFile: true

  # Intencao de atendimento (backlog #4 / status INTENTION): coluna desired_time (horario pretendido)
  - include:
      file: changesets/80-attendance/009-add-desired_time-to-attendance.yaml
      relativeToChangeLogFile: true

  # Pedido de corte (BUG5 C2 / "solicitar corte"): tabela cut_request + join cut_request_service_item
  - include:
      file: changesets/80-attendance/010-create-cut-request.yaml
      relativeToChangeLogFile: true

  # Oferta ABERTA de troca de posicao (Client C13 / Partner S11): tabela swap_offer + join swap_offer_service_item
  - include:
      file: changesets/80-attendance/011-create-swap-offer.yaml
      relativeToChangeLogFile: true

  # Esqueci minha senha (backlog #1): tabela password_reset_code (código de 6 dígitos, hash bcrypt)
  - include:
      file: changesets/20-auth/022-create-password_reset_code.yaml
      relativeToChangeLogFile: true

  # S1 (fatia 1): status de trabalho do profissional (WORKING/ON_BREAK/OFF), base do open_status derivado
  - include:
      file: changesets/60-professional/009-add-work_status-to-professional.yaml
      relativeToChangeLogFile: true

  # S1 (fatia 3): "fechar fila" — flag accepting_new (drenagem: fila fechada segue sendo atendida)
  - include:
      file: changesets/60-professional/010-add-accepting_new-to-professional.yaml
      relativeToChangeLogFile: true

  # S1 (fatia 5): auto-fechamento por horario — carencia de 15min apos o closing_time (BUG1)
  - include:
      file: changesets/60-professional/011-add-closing_grace_until-to-professional.yaml
      relativeToChangeLogFile: true

  # Apagar a conta (Partner S19): marca de anonimizacao no base_user
  - include:
      file: changesets/20-auth/023-add-deleted_at-to-base_user.yaml
      relativeToChangeLogFile: true

  # Indices do caminho quente (B10, 2a metade) — attendance/professional/service_item/intervals/
  # enderecos nao tinham indice nenhum alem da PK. Ver o comentario no proprio changeset.
  - include:
      file: changesets/99-performance/001-create-hot-path-indexes.yaml
      relativeToChangeLogFile: true

  # Janela de graca no refresh: elo entre o token revogado e o que o substituiu (corrida de refresh)
  - include:
      file: changesets/20-auth/024-add-replaced_by-to-refresh_token.yaml
      relativeToChangeLogFile: true

  # ServiceType legado (SALON_BEAUTY/MANICURE) derrubando GET /establishment com 500 em prod —
  # o mesmo defeito do 022, na outra coluna. Ver o comentario no proprio changeset.
  - include:
      file: changesets/50-establishment/026-remap-legacy-service-types.yaml
      relativeToChangeLogFile: true

  # Categoria principal ausente: o 018 backfillou dois UUIDs escritos a mao e o resto
  # ficou nulo. Preenche quem tem UM servico; quem tem varios e decisao do dono.
  - include:
      file: changesets/50-establishment/027-backfill-null-service-type.yaml
      relativeToChangeLogFile: true

  # Receita LIQUIDA do profissional: pro_receives no service_item (nulo em servico legado)
  - include:
      file: changesets/50-establishment/028-add-pro_receives-to-service_item.yaml
      relativeToChangeLogFile: true

  # Receita LIQUIDA do profissional: divisao do preco congelada no attendance (nula nos anteriores)
  - include:
      file: changesets/80-attendance/012-add-price-split-to-attendance.yaml
      relativeToChangeLogFile: true

  # Horario por dia (#2): semana (7 linhas) + excecao por data; backfill do horario unico
  - include:
      file: changesets/50-establishment/029-create-establishment-hours-by-day.yaml
      relativeToChangeLogFile: true

  # Regra de preco de 16/09: base_price (valor digitado) no service_item
  - include:
      file: changesets/50-establishment/030-add-base_price-to-service_item.yaml
      relativeToChangeLogFile: true

  # Multa de saida (D4): tolerancia gravada no ingresso + valor do evento de penalidade
  - include:
      file: changesets/80-attendance/013-add-tolerance_until-to-attendance.yaml
      relativeToChangeLogFile: true
  - include:
      file: changesets/70-client/006-add-amount-to-client_penalty_event.yaml
      relativeToChangeLogFile: true
