databaseChangeLog:
  # divida-por-fora-e-abatimento (DEC-109/115): quando o profissional da o Recebi por fora do app (cartao, dinheiro, nota), ele fica
  # devendo ao app os R$ 2,90 inteiros do corte (preco menos o que ele recebe). Sem o Asaas implantado ninguem deve de verdade: a divida
  # nasce simulated=true (so teste) ate o Painel ligar a flag "divida real" (app_setting).
  - changeSet:
      id: 055-create-professional_debt
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: professional_debt
      changes:
        - createTable:
            tableName: professional_debt
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_professional_debt, nullable: false}}
              - column: {name: professional_id, type: UUID, constraints: {nullable: false}}
              - column: {name: attendance_id, type: UUID, constraints: {nullable: false, unique: true, uniqueConstraintName: uk_professional_debt_attendance}}
              - column: {name: amount, type: "NUMERIC(10,2)", constraints: {nullable: false}}
              - column: {name: origin, type: "VARCHAR(20)", constraints: {nullable: false}}
              - column: {name: status, type: "VARCHAR(10)", constraints: {nullable: false}}
              - column: {name: simulated, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: settled_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: professional_debt
            indexName: ix_professional_debt_professional
            columns:
              - column: {name: professional_id}
              - column: {name: status}

  - changeSet:
      id: 055-create-app_setting
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: app_setting
      changes:
        - createTable:
            tableName: app_setting
            columns:
              - column: {name: setting_key, type: "VARCHAR(60)", constraints: {primaryKey: true, primaryKeyName: pk_app_setting, nullable: false}}
              - column: {name: setting_value, type: "VARCHAR(200)", constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: UUID}
