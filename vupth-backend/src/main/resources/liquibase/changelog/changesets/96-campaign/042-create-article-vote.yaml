databaseChangeLog:
  # Voto do artigo (voto-do-artigo, 17/10): o joinha/dedao de cada artigo do site de suporte. Um voto por IP,
  # artigo e dia (o ultimo vale); o IP nunca e guardado, so o hash dele.
  - changeSet:
      id: 042-create-article-vote
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: article_vote
      changes:
        - createTable:
            tableName: article_vote
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_article_vote, nullable: false}}
              - column: {name: slug, type: VARCHAR(80), constraints: {nullable: false}}
              - column: {name: ip_hash, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: vote, type: VARCHAR(4), constraints: {nullable: false}}
              - column: {name: voted_on, type: DATE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: article_vote
            columnNames: slug, ip_hash, voted_on
            constraintName: uk_article_vote_slug_ip_day
