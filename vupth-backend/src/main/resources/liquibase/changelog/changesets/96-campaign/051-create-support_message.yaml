databaseChangeLog:
  # admin-caixa-de-suporte (22/10): o que o formulario do site de suporte recebe fica guardado, para o painel listar
  # (alem do e-mail). Guarda o que o formulario manda; o e-mail do remetente e dado pessoal (LGPD): so o painel le.
  - changeSet:
      id: 051-create-support_message
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: support_message
      changes:
        - createTable:
            tableName: support_message
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_support_message, nullable: false}}
              - column: {name: name, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: email, type: VARCHAR(254), constraints: {nullable: false}}
              - column: {name: profile, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: category, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: subject, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: message, type: VARCHAR(2000), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createIndex:
            tableName: support_message
            indexName: ix_support_message_created
            columns:
              - column: {name: created_at}
