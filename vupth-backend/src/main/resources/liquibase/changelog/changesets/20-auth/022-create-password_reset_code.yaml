databaseChangeLog:
  # Esqueci minha senha (backlog #1). Codigo de reset de 6 digitos enviado por e-mail.
  # NUNCA guardamos o codigo em claro: so o hash bcrypt (code_hash). O par (user + codigo) tem
  # validade curta (expires_at), e de uso unico (consumed) e limita tentativas (attempts) para
  # frear brute-force de 6 digitos. POST /auth/forgot-password cria; POST /auth/reset-password consome.
  - changeSet:
      id: 022-create-password_reset_code
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: password_reset_code
      changes:
        - createTable:
            tableName: password_reset_code
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_password_reset_code
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: code_hash
                  type: VARCHAR(72)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_code
            baseColumnNames: user_id
            constraintName: fk_password_reset_code_user
            referencedTableName: base_user
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: password_reset_code
            indexName: idx_password_reset_code_user
            columns:
              - column:
                  name: user_id
