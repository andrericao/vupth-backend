databaseChangeLog:
  # Exclusao de conta pela web (exclusao-por-link, 08/10). Link de uso unico mandado ao e-mail cadastrado.
  # NUNCA guardamos o token em claro: so o SHA-256 (token_hash, unico), que e por onde o link e achado.
  # Validade curta (expires_at), uso unico (consumed) e teto de senhas erradas (attempts).
  - changeSet:
      id: 025-create-account_deletion_token
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: account_deletion_token
      changes:
        - createTable:
            tableName: account_deletion_token
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account_deletion_token
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_deletion_token_hash
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: account_deletion_token
            baseColumnNames: user_id
            constraintName: fk_account_deletion_token_user
            referencedTableName: base_user
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: account_deletion_token
            indexName: idx_account_deletion_token_user
            columns:
              - column:
                  name: user_id
