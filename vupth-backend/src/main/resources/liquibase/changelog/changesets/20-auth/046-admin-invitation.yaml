databaseChangeLog:
  # Painel, fatia 3 (convite-com-permissoes): o convite por e-mail com as permissoes escolhidas pelo Andre.
  # Do token so o hash; vale 7 dias e uma vez.
  - changeSet:
      id: 046-admin-invitation
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: admin_invitation
      changes:
        - createTable:
            tableName: admin_invitation
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_admin_invitation, nullable: false}}
              - column: {name: email, type: VARCHAR(150), constraints: {nullable: false}}
              - column: {name: token_hash, type: VARCHAR(64), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_admin_invitation_token}}
              - column: {name: permissions, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: invited_by, type: UUID, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: accepted_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: revoked_at, type: TIMESTAMP WITH TIME ZONE}
