databaseChangeLog:
  - changeSet:
      id: 003-create-refresh_token
      author: andrericao
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    defaultValueComputed: CURRENT_TIMESTAMP
                    nullable: false

              - column:
                  name: revoked_at
                  type: TIMESTAMP