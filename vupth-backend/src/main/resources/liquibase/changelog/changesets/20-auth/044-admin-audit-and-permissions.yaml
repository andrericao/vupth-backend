databaseChangeLog:
  # Painel (painel-de-monitoramento e convite-com-permissoes, fatia 1): a auditoria de tudo que passa por /admin/**
  # e as permissoes do usuario do painel. ADMIN sem nenhuma linha em admin_permission e o dono e pode tudo.
  - changeSet:
      id: 044-admin-audit-and-permissions
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: admin_audit
      changes:
        - createTable:
            tableName: admin_audit
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_admin_audit, nullable: false}}
              - column: {name: admin_id, type: UUID, constraints: {nullable: false}}
              - column: {name: method, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: path, type: VARCHAR(300), constraints: {nullable: false}}
              - column: {name: query, type: VARCHAR(500)}
              - column: {name: body, type: VARCHAR(2000)}
              - column: {name: status, type: INT, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createIndex:
            tableName: admin_audit
            indexName: ix_admin_audit_created
            columns:
              - column: {name: created_at}
        - createTable:
            tableName: admin_permission
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_admin_permission, nullable: false}}
              - column: {name: user_id, type: UUID, constraints: {nullable: false}}
              - column: {name: permission, type: VARCHAR(30), constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: admin_permission
            columnNames: user_id, permission
            constraintName: uk_admin_permission_user_permission
