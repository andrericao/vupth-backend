databaseChangeLog:
  # Painel, fatia 3 (login seguro): o segundo fator TOTP de cada usuario do painel e os codigos de recuperacao.
  # O segredo vai cifrado (S4); dos codigos de recuperacao so o hash.
  - changeSet:
      id: 045-admin-totp
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: admin_totp
      changes:
        - createTable:
            tableName: admin_totp
            columns:
              - column: {name: user_id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_admin_totp, nullable: false}}
              - column: {name: secret, type: VARCHAR(400), constraints: {nullable: false}}
              - column: {name: enabled, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: failed_attempts, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: locked_until, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createTable:
            tableName: admin_recovery_code
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_admin_recovery_code, nullable: false}}
              - column: {name: user_id, type: UUID, constraints: {nullable: false}}
              - column: {name: code_hash, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: used_at, type: TIMESTAMP WITH TIME ZONE}
        - createIndex:
            tableName: admin_recovery_code
            indexName: ix_admin_recovery_code_user
            columns:
              - column: {name: user_id}
