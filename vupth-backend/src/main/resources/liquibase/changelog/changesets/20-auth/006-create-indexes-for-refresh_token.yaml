databaseChangeLog:
  - changeSet:
      id: 006-create-indexes-for-refresh_token
      author: andrericao
      changes:
        - createIndex:
            indexName: idx_refresh_tokens_token
            tableName: refresh_tokens
            columns:
              - column:
                  name: token

        - createIndex:
            indexName: idx_refresh_tokens_user_id
            tableName: refresh_tokens
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_refresh_tokens_expiry_date
            tableName: refresh_tokens
            columns:
              - column:
                  name: expiry_date