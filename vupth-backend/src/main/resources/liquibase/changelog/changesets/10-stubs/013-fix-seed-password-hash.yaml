databaseChangeLog:

  # ─────────────────────────────────────────────────────────────
  # CORRECAO DO HASH DA SENHA DO SEED
  #
  # O 012-seed-data.yaml documenta "Senha@123" no cabecalho, mas gravou um hash de OUTRA
  # senha — nenhuma das contas @seed.dev conseguia logar (401 BAD_CREDENTIALS). Medido em
  # 2026-08-06 com bcrypt.checkpw contra o literal do YAML:
  #
  #   checkpw("Senha@123", "$2b$10$BruROnjV7GvYtMSNlaeD5.WGq0dz.PZNoQrR/dMSWiHz.QyHDkIf6") = False
  #
  # A senha original do hash antigo se perdeu (19 candidatos plausiveis testados, nenhum bateu),
  # entao a correcao e reescrever o hash, nao descobrir a senha.
  #
  # ⚠️ Por que um changeset NOVO em vez de corrigir o 012 no lugar: o 012 ja consta no
  # DATABASECHANGELOG de todo banco existente, e editar changeset ja executado nao reexecuta
  # (o validCheckSum: ANY de la impede o erro de checksum, mas nao reaplica o INSERT). Banco novo
  # pega o hash certo pelo 012 corrigido; banco existente pega por este UPDATE. Os dois convergem.
  #
  # Sintoma que isso resolve: QA manual abre o app, tenta entrar com conta de demonstracao e
  # nao consegue — precisa registrar uma conta nova toda vez.
  # ─────────────────────────────────────────────────────────────
  - changeSet:
      id: fix-seed-password-hash
      author: vupth-seed
      context: "!prod"
      validCheckSum: ANY
      comment: "Reescreve o hash das contas @seed.dev para a senha documentada (Senha@123)"
      changes:
        - update:
            tableName: base_user
            columns:
              - column:
                  name: password
                  value: "$2b$10$9bMjOHT.uFMIdFp0x0fOcuwCZlNDm5yDvYkMK5QZUQAe8cV0mTcHe"
            where: "email LIKE '%@seed.dev'"
