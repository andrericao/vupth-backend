databaseChangeLog:
  - changeSet:
      id: 008-create-stub-user_roles
      author: andrericao
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: base_user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false