databaseChangeLog:

  # ── seed: base_user for the owner ──────────────────────────────────
  - changeSet:
      id: 012-seed-base-user-owner
      author: vupth-seed
      preConditions:
        - onFail: MARK_RAN
        - not:
            - rowCount:
                tableName: base_user
                expectedRows: 0
                # skip if users already exist (re-run safe)
      changes:
        - insert:
            tableName: base_user
            columns:
              - column: { name: id,         value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }
              - column: { name: first_name,  value: "Seed" }
              - column: { name: last_name,   value: "Owner" }
              - column: { name: email,       value: "seed-owner@vupth.local" }
              - column: { name: password,    value: "$2a$10$XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" }
              - column: { name: is_active,   valueBoolean: true }

  # ── seed: owner row ────────────────────────────────────────────────
  - changeSet:
      id: 012-seed-owner
      author: vupth-seed
      preConditions:
        - onFail: MARK_RAN
        - not:
            - rowCount:
                tableName: owner
                expectedRows: 0
      changes:
        - insert:
            tableName: owner
            columns:
              - column: { name: id, value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

  # ── seed: establishments ───────────────────────────────────────────
  - changeSet:
      id: 012-seed-establishments
      author: vupth-seed
      changes:
        - insert:
            tableName: establishment
            columns:
              - column: { name: id,                  value: "bbbbbbbb-0001-0001-0001-bbbbbbbbbbbb" }
              - column: { name: name,                value: "Barbearia do Ze" }
              - column: { name: url_image,           value: "https://placehold.co/400x300?text=Barber" }
              - column: { name: status,              value: "ACTIVE" }
              - column: { name: current_open_status, value: "OPEN" }
              - column: { name: owner_id,            value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

        - insert:
            tableName: establishment
            columns:
              - column: { name: id,                  value: "bbbbbbbb-0002-0002-0002-bbbbbbbbbbbb" }
              - column: { name: name,                value: "Salao Beleza Pura" }
              - column: { name: url_image,           value: "https://placehold.co/400x300?text=Salon" }
              - column: { name: status,              value: "ACTIVE" }
              - column: { name: current_open_status, value: "OPEN" }
              - column: { name: owner_id,            value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

        - insert:
            tableName: establishment
            columns:
              - column: { name: id,                  value: "bbbbbbbb-0003-0003-0003-bbbbbbbbbbbb" }
              - column: { name: name,                value: "Studio Sobrancelha Perfeita" }
              - column: { name: url_image,           value: "https://placehold.co/400x300?text=Eyebrow" }
              - column: { name: status,              value: "ACTIVE" }
              - column: { name: current_open_status, value: "CLOSED" }
              - column: { name: owner_id,            value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

        - insert:
            tableName: establishment
            columns:
              - column: { name: id,                  value: "bbbbbbbb-0004-0004-0004-bbbbbbbbbbbb" }
              - column: { name: name,                value: "Manicure & Pedicure Top" }
              - column: { name: url_image,           value: "https://placehold.co/400x300?text=Manicure" }
              - column: { name: status,              value: "ACTIVE" }
              - column: { name: current_open_status, value: "OPEN" }
              - column: { name: owner_id,            value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

        - insert:
            tableName: establishment
            columns:
              - column: { name: id,                  value: "bbbbbbbb-0005-0005-0005-bbbbbbbbbbbb" }
              - column: { name: name,                value: "Espaco Beleza Total" }
              - column: { name: url_image,           value: "https://placehold.co/400x300?text=Multi" }
              - column: { name: status,              value: "ACTIVE" }
              - column: { name: current_open_status, value: "OPEN" }
              - column: { name: owner_id,            value: "aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa" }

  # ── seed: establishment_services (service types) ───────────────────
  - changeSet:
      id: 012-seed-establishment-services
      author: vupth-seed
      changes:
        # Barbearia do Ze -> BARBER
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0001-0001-0001-bbbbbbbbbbbb" }
              - column: { name: service,          value: "BARBER" }

        # Salao Beleza Pura -> SALON_BEAUTY
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0002-0002-0002-bbbbbbbbbbbb" }
              - column: { name: service,          value: "SALON_BEAUTY" }

        # Studio Sobrancelha Perfeita -> EYEBROW
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0003-0003-0003-bbbbbbbbbbbb" }
              - column: { name: service,          value: "EYEBROW" }

        # Manicure & Pedicure Top -> MANICURE
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0004-0004-0004-bbbbbbbbbbbb" }
              - column: { name: service,          value: "MANICURE" }

        # Espaco Beleza Total -> SALON_BEAUTY + MANICURE + EYEBROW (multi-service)
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0005-0005-0005-bbbbbbbbbbbb" }
              - column: { name: service,          value: "SALON_BEAUTY" }
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0005-0005-0005-bbbbbbbbbbbb" }
              - column: { name: service,          value: "MANICURE" }
        - insert:
            tableName: establishment_services
            columns:
              - column: { name: establishment_id, value: "bbbbbbbb-0005-0005-0005-bbbbbbbbbbbb" }
              - column: { name: service,          value: "EYEBROW" }
