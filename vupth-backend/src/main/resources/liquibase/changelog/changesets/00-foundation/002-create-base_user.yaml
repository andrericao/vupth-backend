databaseChangeLog:
  - changeSet:
      id: 002-create-base_user
      author: andrericao
      changes:
        - createTable:
            tableName: base_user

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(100)

              - column:
                  name: last_name
                  type: VARCHAR(100)

              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(72)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: birth_date
                  type: DATE

              - column:
                  name: gender
                  type: VARCHAR(20)

              - column:
                  name: profile_image_url
                  type: VARCHAR(255)

              - column:
                  name: user_address_id
                  type: UUID

              - column:
                  name: last_token_cleanup_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    defaultValueComputed: CURRENT_TIMESTAMP
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    defaultValueComputed: CURRENT_TIMESTAMP
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false