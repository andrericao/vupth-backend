databaseChangeLog:
  # avisar-quando-abrir (BAK-8, DEC-160): pedido do cliente logado, so do dia (expira a meia-noite, sem recorrencia).
  # kind: NOTIFY_OPEN (avisar quando o profissional/a loja comecar a atender) ou QUEUE_MOVING (avisar quando a fila
  # comecar a andar: primeiro atendimento iniciado). professional_id nulo = qualquer profissional da loja.
  - changeSet:
      id: 073-create-open_watch
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: open_watch
      changes:
        - createTable:
            tableName: open_watch
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: user_id, type: UUID, constraints: {nullable: false}}
              - column: {name: establishment_id, type: UUID, constraints: {nullable: false}}
              - column: {name: professional_id, type: UUID}
              - column: {name: kind, type: "VARCHAR(20)", constraints: {nullable: false}}
              - column: {name: day, type: DATE, constraints: {nullable: false}}
              - column: {name: created_at, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
              - column: {name: fired_at, type: "TIMESTAMP WITH TIME ZONE"}
        - createIndex:
            tableName: open_watch
            indexName: idx_open_watch_establishment_day
            columns:
              - column: {name: establishment_id}
              - column: {name: day}
        - createIndex:
            tableName: open_watch
            indexName: idx_open_watch_user_day
            columns:
              - column: {name: user_id}
              - column: {name: day}
