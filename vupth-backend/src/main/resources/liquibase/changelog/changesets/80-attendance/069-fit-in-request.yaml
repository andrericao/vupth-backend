databaseChangeLog:
  # encaixe-diluido (DEC-136 a 141, 31/10): o pedido de encaixe na fila do dia, entre o cliente e o profissional, com o adicional
  # negociado (metade profissional, metade app). A diluicao do tempo ja existe (item #38, fit_ahead_length). So acrescenta.
  - changeSet:
      id: 069-fit-in-request
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: {tableName: fit_in_request}
      changes:
        - createTable:
            tableName: fit_in_request
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: client_id, type: UUID, constraints: {nullable: false}}
              - column: {name: professional_id, type: UUID, constraints: {nullable: false}}
              - column: {name: establishment_id, type: UUID, constraints: {nullable: false}}
              - column: {name: service_item_ids, type: TEXT, constraints: {nullable: false}}
              - column: {name: ahead_count, type: INT, constraints: {nullable: false}}
              - column: {name: desired_time, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
              - column: {name: current_extra, type: "NUMERIC(10,2)", constraints: {nullable: false}}
              - column: {name: last_offer_by, type: VARCHAR(12), constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(12), constraints: {nullable: false}}
              - column: {name: final_extra, type: "NUMERIC(10,2)"}
              - column: {name: resulting_attendance_id, type: UUID}
              - column: {name: created_at, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
              - column: {name: decided_at, type: "TIMESTAMP WITH TIME ZONE"}
        - createIndex:
            tableName: fit_in_request
            indexName: idx_fit_in_request_professional
            columns:
              - column: {name: professional_id}
              - column: {name: status}
        - createIndex:
            tableName: fit_in_request
            indexName: idx_fit_in_request_client
            columns:
              - column: {name: client_id}
