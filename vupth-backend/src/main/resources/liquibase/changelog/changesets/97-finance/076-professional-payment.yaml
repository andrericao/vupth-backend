databaseChangeLog:
  # pagamento-ao-profissional (Andre, 06/11): o historico do que o app pagou de premios e creditos de campanha. So recebe linhas novas:
  # o gatilho recusa UPDATE e DELETE, e o estorno e outra linha (REVERSAL). Os pagamentos ja marcados entram como "migrado, sem nota".
  - changeSet:
      id: 076-professional-payment
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: professional_payment
      changes:
        - createTable:
            tableName: professional_payment
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: professional_id, type: UUID, constraints: {nullable: false}}
              - column: {name: campaign_id, type: UUID, constraints: {nullable: false}}
              - column: {name: type, type: "VARCHAR(10)", constraints: {nullable: false}}
              - column: {name: amount, type: "NUMERIC(10,2)", constraints: {nullable: false}}
              - column: {name: paid_at, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
              - column: {name: note, type: "VARCHAR(200)"}
              - column: {name: reversal_of, type: UUID}
              - column: {name: created_by, type: UUID}
              - column: {name: created_at, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_professional_payment_reversal
            baseTableName: professional_payment
            baseColumnNames: reversal_of
            referencedTableName: professional_payment
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_professional_payment_reversal
            tableName: professional_payment
            columnNames: reversal_of
        - createIndex:
            indexName: idx_professional_payment_professional
            tableName: professional_payment
            columns:
              - column: {name: professional_id}
              - column: {name: paid_at}
        - sql:
            sql: >
              INSERT INTO professional_payment (id, professional_id, campaign_id, type, amount, paid_at, note, created_at)
              SELECT gen_random_uuid(), x.beneficiary_id, x.campaign_id, 'PAYMENT', SUM(x.amount), x.paid_at, 'migrado, sem nota', now()
              FROM (SELECT beneficiary_id, campaign_id, amount, paid_at FROM referral_credit WHERE paid_at IS NOT NULL AND NOT test
                    UNION ALL
                    SELECT beneficiary_id, campaign_id, amount, paid_at FROM coupon_credit WHERE paid_at IS NOT NULL) x
              GROUP BY x.beneficiary_id, x.campaign_id, x.paid_at
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION professional_payment_immutable() RETURNS trigger AS $$
              BEGIN
                RAISE EXCEPTION 'professional_payment e imutavel: o estorno e uma nova linha';
              END;
              $$ LANGUAGE plpgsql;
              CREATE TRIGGER trg_professional_payment_immutable BEFORE UPDATE OR DELETE ON professional_payment
                FOR EACH ROW EXECUTE FUNCTION professional_payment_immutable();
