databaseChangeLog:
  # gateway-de-pagamento, fatia 1 (24/10): a conta de recebimento (subconta do Asaas) de cada profissional, com o aceite guardado
  # (versao do texto, data, IP e a marca de teste). Nao guarda a chave de API da subconta: a divisao usa so o walletId.
  - changeSet:
      id: 060-create-payment_account
      author: andrericao
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: {tableName: payment_account}
      changes:
        - createTable:
            tableName: payment_account
            columns:
              - column: {name: user_id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: provider, type: "VARCHAR(20)", defaultValue: ASAAS, constraints: {nullable: false}}
              - column: {name: provider_account_id, type: "VARCHAR(60)", constraints: {nullable: false}}
              - column: {name: wallet_id, type: "VARCHAR(60)", constraints: {nullable: false}}
              - column: {name: mode, type: "VARCHAR(10)", constraints: {nullable: false}}
              - column: {name: status, type: "VARCHAR(20)", constraints: {nullable: false}}
              - column: {name: accept_version, type: "VARCHAR(40)", constraints: {nullable: false}}
              - column: {name: accepted_at, type: "TIMESTAMP WITH TIME ZONE", constraints: {nullable: false}}
              - column: {name: accepted_ip, type: "VARCHAR(60)"}
              - column: {name: test, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: "TIMESTAMP WITH TIME ZONE", defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
