# ============================
# DATASOURCE - TEST
# ============================
#spring.datasource.url=${DATABASE_URL}
#spring.datasource.username=${DATABASE_USERNAME}
#spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.url=jdbc:postgresql://localhost:5432/vupth_db_test
spring.datasource.username=postgres
spring.datasource.password=vupth_test
# admin_test
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# LIQUIBASE
# ============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase/changelog/changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.liquibase.drop-first=true
spring.liquibase.contexts=test

# ============================
# PUSH NOTIFICATIONS — no-op nos testes (sem HTTP para o Expo)
# ============================
vupth.push.provider=none

# ============================
# E-MAIL — no-op nos testes (sem SMTP); os testes capturam o codigo via @MockBean EmailSender
# ============================
vupth.mail.provider=none

# ============================
# FUSO DE NEGOCIO (BUG2b) — fixo nos testes p/ que o "relogio de parede" das asercoes
# nao dependa do fuso do host/CI. Mesmo default de producao.
vupth.timezone=America/Sao_Paulo

# ============================
# PROMOCAO DE INTENCAO — nao armar o timer de wall-clock nos testes
# (cada contexto de integracao subiria um despertador; os testes exercitam
#  promoteIntention/runPromotionCycle diretamente). Ver IntentionPromotionScheduler.
# ============================
vupth.intention-promotion.auto-arm=false

# AUTO-NEGA DE PEDIDO DE CORTE — idem: nao armar o timer de wall-clock nos testes
# (os testes exercitam expireDueCutRequests/runExpiryCycle diretamente). Ver CutRequestExpiryScheduler.
vupth.cut-request.auto-arm=false

# AUTO-FECHAMENTO POR HORARIO (S1 fatia 5) — idem: nao armar o timer de wall-clock nos testes
# (os testes exercitam promptDueClosings/applyDueGraces/runCycle diretamente). Ver EstablishmentAutoCloseScheduler.
vupth.auto-close.auto-arm=false