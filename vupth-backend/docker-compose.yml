services:

  db:
    image: postgres:16-alpine
    container_name: vupth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vupth_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_dev
    ports:
      - "5432:5432"
    volumes:
      - vupth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vupth_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vupth-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/vupth_dev
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: admin_dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  vupth_pgdata: