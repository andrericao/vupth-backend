version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: vupth_postgres_dev
    environment:
      POSTGRES_DB: vupth_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vupth_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vupth_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: vupth_backend_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/vupth_db_dev
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: vupth_dev
    restart: unless-stopped
    networks:
      - vupth_net

volumes:
  postgres_data:
  maven_cache:

networks:
  vupth_net: